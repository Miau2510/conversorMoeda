<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <section>
        <div id="texto">
            <h2>Conversor de Moedas</h2>
            <p>Selecione uma moeda para converter do Real para a moeda selecionada</p>
        </div>
        <div id="conversor">
            <div class="moedas">
                BRL (Real Brasileiro):
                <input type="number" id="real">
            </div>
            <div class="moedas">

                <label>
                    
                    <select name="moedaEs" id="moedaEs">
                        
                        <option value="">Selecione uma moeda...</option>
                        <option value="USD">USD (Dólar Americano)</option>
                        <option value="EUR">EUR (Euro)</option>
                        <option value="GBP">GBP (Libra Esterlina)</option>
                        <option value="JPY">JPY (Iene Japonês)</option>
                        <option value="ARS">ARS (Peso Argentino)</option>
                        <option value="CNY">CNY (Yuan Chinês)</option>
                        <option value="CAD">CAD (Dólar Canadense)</option>
                        <option value="AUD">AUD (Dólar Australiano)</option>
                    
                    </select>
                
                </label>
                
                <input type="number" id="moedaE" readonly>
            
            </div>
        </div>
        <button id="converter" onclick="converte()">Converter</button>

        <script src="scripts.js"></script>
    </section>
</body>

</html>
